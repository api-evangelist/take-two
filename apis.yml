name: Take Two
description: >-
  Take-Two Interactive Software, Inc. (NASDAQ: TTWO) is a leading developer,
  publisher, and marketer of interactive entertainment for consumers worldwide,
  headquartered in New York City. The company delivers its products principally
  through three wholly owned labels — Rockstar Games, 2K, and Zynga — spanning
  console, PC, and mobile platforms via physical retail, digital download, online
  platforms, and cloud streaming. Franchises include Grand Theft Auto, Red Dead
  Redemption, NBA 2K, Borderlands, and mobile titles such as Words With Friends
  and Toon Blast. Take-Two is a publicly traded interactive entertainment holding
  company; it does not publish a public developer API program, developer portal,
  or API documentation at the corporate level. This profile was surfaced as a
  general-catalyst job-board listing and carried into the API Evangelist network
  as a lead; enrichment found no public API surface to catalog.
